# Optional server-only file mount. Use with -f compose.yaml -f compose.tmdb.yaml.
services:
  server:
    environment:
      WETUBE_TMDB_TOKEN_FILE: /run/secrets/tmdb-token
      WETUBE_TMDB_ACCEPT_TERMS: "true"
    volumes:
      - type: bind
        source: /mnt/Main/WeTube/tmdb_token
        target: /run/secrets/tmdb-token
        read_only: true
        bind: {create_host_path: false}
