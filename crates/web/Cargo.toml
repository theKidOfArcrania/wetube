[package]
name = "wetube-web"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
serde.workspace = true
wetube-core.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
leptos = { version = "0.8", default-features = false, features = ["csr"] }
gloo-net = { version = "0.6", features = ["json"] }
gloo-timers = { version = "0.3", features = ["futures"] }
js-sys = "0.3"
console_error_panic_hook = "0.1"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["HtmlInputElement", "HtmlSelectElement", "HtmlVideoElement", "HtmlMediaElement", "SubmitEvent", "AbortController", "AbortSignal", "Window", "Performance"] }
