[workspace]
members = ["crates/core", "crates/backend", "crates/server", "crates/worker", "crates/web"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false

[workspace.dependencies]
anyhow = "1"
argon2 = "0.5"
axum = "0.8"
clap = { version = "4", features = ["derive", "env"] }
fs2 = "0.4"
hex = "0.4"
libc = "0.2"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time", "process", "io-util", "sync", "net"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
wetube-core = { path = "crates/core" }
wetube-backend = { path = "crates/backend" }

[profile.release]
lto = "thin"
strip = true

[profile.release.package.wetube-web]
strip = "debuginfo"
