name: wetube

x-app: &app
  image: thekidofarcrania/wetube:latest
  pull_policy: never
  platform: linux/amd64
  user: "568:568"
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
  environment: &environment
    WETUBE_STATE_DIR: /data/state
    WETUBE_INCOMING_DIR: /data/incoming
    WETUBE_SCRATCH_DIR: /data/scratch
    WETUBE_MEDIA_DIR: /data/media
    WETUBE_STATIC_DIR: /opt/wetube/dist
    WETUBE_BIND: 0.0.0.0:8080
    WETUBE_ORIGIN: http://192.168.1.15:8080
    RUST_LOG: info
  volumes:
    - type: bind
      source: /mnt/Main/WeTube/state
      target: /data/state
      bind: {create_host_path: false}
    - type: bind
      source: /mnt/Main/Documents/staging
      target: /data/incoming
      read_only: true
      bind: {create_host_path: false}
    - type: bind
      source: /mnt/Main/WeTube/scratch
      target: /data/scratch
      bind: {create_host_path: false}
    - type: bind
      source: /mnt/Main/WeTube/media
      target: /data/media
      bind: {create_host_path: false}
  stop_grace_period: 24h

services:
  server:
    <<: *app
    command: [server, serve]
    environment:
      <<: *environment
      WETUBE_ALLOW_ANY_HOST: "true"
    restart: unless-stopped
    ports:
      - "8080:8080"
    healthcheck:
      test: [CMD, curl, --noproxy, "*", --fail, --silent, --show-error, --max-time, "3", --header, "Host: 192.168.1.15:8080", "http://127.0.0.1:8080/health/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
  worker:
    <<: *app
    command: [worker, run, --threads, "2"]
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
